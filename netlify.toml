[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Service worker auto-destructeur (voir public/sw.js) : il doit toujours etre
# recharge depuis le serveur, jamais depuis le cache, sinon les navigateurs
# gardent l'ancien service worker de Gatsby.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# Le panneau d'administration ne doit pas etre indexe.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Les images et CSS generes par Astro portent un hash dans leur nom :
# on peut les mettre en cache indefiniment.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
